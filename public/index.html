<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadow Haven</title>
  <meta name="description" content="Keep the harbor lights burning. One of you is a Shade." />
  <meta name="theme-color" content="#0e1220" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <!-- Home: create or join -->
  <main id="home" class="screen">
    <div class="hero">
      <div id="hero-keeper" class="hero-keeper" aria-hidden="true"></div>
      <h1>Shadow Haven</h1>
      <p class="tag">Keep the harbor lights burning. One of you is a Shade.</p>
    </div>

    <form id="home-form" class="card" autocomplete="off">
      <label for="name">Your name</label>
      <input id="name" name="name" maxlength="16" placeholder="e.g. Wren" required />

      <button type="button" id="create" class="primary">Create a room</button>

      <div class="or"><span>or join a friend</span></div>

      <div class="join-row">
        <input id="code" name="code" maxlength="4" placeholder="CODE" aria-label="Room code"
               autocapitalize="characters" spellcheck="false" />
        <button type="submit" id="join">Join</button>
      </div>
      <p id="home-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- Lobby -->
  <main id="lobby" class="screen" hidden>
    <header class="lobby-head">
      <div>
        <p class="eyebrow">Room code</p>
        <h2 id="room-code" class="room-code">····</h2>
      </div>
      <button id="copy-link" class="ghost">Copy invite link</button>
    </header>

    <p id="lobby-status" class="muted"></p>

    <ul id="players" class="players" aria-live="polite"></ul>

    <div id="host-controls" class="host-controls" hidden>
      <button id="add-bot" class="ghost">+ Add a bot Keeper</button>
      <button id="start" class="primary">Start</button>
    </div>
    <p id="waiting" class="muted center" hidden>Waiting for the host to start…</p>

    <p id="lobby-error" class="error center" role="alert"></p>
    <button id="leave" class="link">Leave room</button>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
