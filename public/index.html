<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadow Haven</title>
  <meta name="description" content="Keep the harbor lights burning. One of you is a Shade." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <svg class="keeper" viewBox="0 0 120 200" role="img" aria-label="A Lantern Keeper">
      <!-- glow -->
      <circle cx="60" cy="52" r="46" fill="url(#glow)" />
      <!-- lantern head: hex cage with flame -->
      <path d="M60 14 L64 22 L56 22 Z" fill="#3a3f4b" />
      <rect x="48" y="22" width="24" height="5" rx="2" fill="#3a3f4b" />
      <path d="M44 30 L76 30 L80 52 L76 74 L44 74 L40 52 Z" fill="#1d2230" stroke="#8a93a6" stroke-width="3" />
      <path class="flame" d="M60 38 C69 50 68 62 60 68 C52 62 51 50 60 38 Z" fill="#ffb347" />
      <path d="M60 50 C64 56 63 62 60 64 C57 62 56 56 60 50 Z" fill="#fff1c1" />
      <line x1="60" y1="30" x2="60" y2="74" stroke="#8a93a6" stroke-width="2" opacity=".5" />
      <rect x="46" y="74" width="28" height="5" rx="2" fill="#3a3f4b" />
      <!-- cloak -->
      <path d="M60 80 C38 84 30 110 28 190 L92 190 C90 110 82 84 60 80 Z" fill="#2b3550" />
      <path d="M60 80 C52 100 50 150 52 190 L68 190 C70 150 68 100 60 80 Z" fill="#232c44" />
      <defs>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#ffb347" stop-opacity=".45" />
          <stop offset="1" stop-color="#ffb347" stop-opacity="0" />
        </radialGradient>
      </defs>
    </svg>

    <h1>Shadow Haven</h1>
    <p class="tag">Keep the harbor lights burning. One of you is a Shade.</p>

    <section class="status">
      <p>Step 0 — the harbor is under construction.</p>
      <button id="check">Check the lighthouse</button>
      <pre id="out" aria-live="polite"></pre>
    </section>
  </main>

  <script>
    const out = document.getElementById("out");
    document.getElementById("check").addEventListener("click", async () => {
      out.textContent = "Signalling…";
      try {
        const health = await fetch("/api/health").then(r => r.json());
        const room = await fetch("/api/room/TEST").then(r => r.json());
        out.textContent =
          `Worker: ${health.ok ? "lit" : "dark"}\n` +
          `Room ${room.room}: answered ${room.pings} time${room.pings === 1 ? "" : "s"}`;
      } catch (e) {
        out.textContent = "No answer from the lighthouse: " + e.message;
      }
    });
  </script>
</body>
</html>
